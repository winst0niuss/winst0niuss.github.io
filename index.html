<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>winst0niuss — apps for Wix stores</title>
<meta name="description" content="Focused apps for Wix online stores. Each one does a single job: size charts, a size finder, pricing by size.">
<meta name="theme-color" content="#0a0d0c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="winst0niuss — apps for Wix stores">
<meta property="og:description" content="Small apps for Wix stores.">
<meta property="og:image" content="https://winst0niuss.github.io/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css">
<style>
  /* Первый экран: заголовок и карусель */
  .hero { position:relative; border-bottom:1px solid var(--line); overflow:hidden; }
  .hero::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(60% 70% at 85% 10%, rgba(198,241,53,.16), transparent 70%),
      radial-gradient(50% 60% at 5% 90%, rgba(15,122,112,.28), transparent 70%); }
  .hero > * { position:relative; }
  .hero-body { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 560px); gap:clamp(32px, 5vw, 64px); align-items:center; padding-top:clamp(24px, 4vw, 48px); padding-bottom:clamp(40px, 5vw, 64px); }
  h1 { margin:0; font:800 clamp(2.5rem, min(9vw, 12vh), 6.5rem)/.98 var(--display); letter-spacing:-.035em; width:fit-content; }
  h1 .line { display:block; }
  h1 .line:nth-child(3) { color:var(--lime); }
  /* Подпись: моноширинный шрифт, как у логотипа, печатается с курсором */
  h1 .by { margin-top:.4em; font:500 clamp(1.1rem, 2.3vw, 1.65rem)/1.2 var(--mono); letter-spacing:0; color:var(--muted); }
  h1 .by b { font-weight:500; color:var(--ink); }
  /* Буквы заголовка поднимаются из размытия по очереди, подпись появляется по символу */
  h1 .char { display:inline-block; animation:letter .7s var(--d) cubic-bezier(.2,.8,.2,1) both; }
  h1 .by .char { display:inline; animation:type .01s var(--d) both; }
  h1 .by::after { content:""; display:inline-block; width:.55em; height:.12em; margin-left:.08em; background:var(--lime); animation:appear .01s var(--caret, 0s) both, blink 1s var(--caret, 0s) steps(1) infinite; }
  @keyframes letter { from { opacity:0; transform:translateY(.45em) rotate(8deg); filter:blur(10px); } }
  @keyframes type { from { opacity:0; } }
  @keyframes blink { 50% { opacity:0; } }
  /* Курсор скрыт, пока подпись не допечатана */
  @keyframes appear { from { visibility:hidden; } }
  .hero-lead { margin:26px 0 0; max-width:520px; font-size:clamp(17px, 2vw, 21px); color:#c9d3ce; }

  /* Карусель скриншотов: слайды собираются из карточек приложений */
  .track { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; scrollbar-width:none; border:1px solid var(--line); border-radius:18px; background:var(--panel); }
  .track::-webkit-scrollbar { display:none; }
  .slide { flex:0 0 100%; scroll-snap-align:start; text-decoration:none; }
  .slide img { display:block; width:100%; height:auto; }
  .slide span { display:block; padding:10px 16px; font-size:15px; font-weight:600; }
  .slide:hover span { color:var(--lime); }
  .carousel-controls { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .carousel-controls output { margin-right:auto; font:500 13px var(--mono); color:var(--muted); }
  .carousel-controls button { width:38px; height:38px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font-size:14px; cursor:pointer; }
  .carousel-controls button:hover { border-color:var(--lime); color:var(--lime); }
  /* Подвал сразу под первым экраном: у первого экрана уже есть линия снизу */
  footer { margin-top:0; border-top:0; }
  @media (max-width:860px) { .hero-body { grid-template-columns:minmax(0, 1fr); } }
  @media (prefers-reduced-motion:reduce) { .track { scroll-behavior:auto; } }
</style>
</head>
<body>
  <header class="hero">
    <div class="wrap nav">
      <a class="brand" href="./"><img src="favicon.svg" alt="" width="30" height="30">winst0niuss</a>
      <nav aria-label="Main"><a class="nav-btn primary" href="apps">Apps</a><a class="nav-btn" href="contact">Contact</a></nav>
    </div>
    <div class="wrap hero-body">
      <div>
        <h1 id="title" aria-label="Small apps for Wix stores by Winst0niuss."><span class="line">Small apps</span><span class="line">for Wix</span><span class="line">stores</span><span class="line by">by <b>Winst0niuss</b>.</span></h1>
        <p class="hero-lead">Each one solves a single problem and needs no code to set up.</p>
      </div>
      <div id="carousel" role="group" aria-roledescription="carousel" aria-label="App screenshots" hidden>
        <div class="track" id="track"></div>
        <div class="carousel-controls">
          <output id="carousel-count"></output>
          <button type="button" id="carousel-prev" aria-label="Previous app">←</button>
          <button type="button" id="carousel-toggle"></button>
          <button type="button" id="carousel-next" aria-label="Next app">→</button>
        </div>
      </div>
    </div>
  </header>

  <footer>
    <div class="wrap"><p>© 2026 <span style="font-family:var(--mono)">winst0niuss</span> · Independent apps published in the Wix App Market. Not affiliated with or endorsed by Wix.com Ltd. · <a href="contact">Contact</a> · <a href="privacy">Privacy policies</a></p></div>
  </footer>

<script>
  const $ = (id) => document.getElementById(id);

  // Заголовок по буквам: крупные строки — с шагом 35 мс, подпись печатается после них
  const splitChars = (node, delay, step) => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === Node.ELEMENT_NODE) {
        delay = splitChars(child, delay, step);
        continue;
      }
      const chars = [...child.textContent].map((char) => {
        // Пробел оставляем текстом: у inline-block он схлопнулся бы
        if (char === " ") return document.createTextNode(" ");
        const span = document.createElement("span");
        span.className = "char";
        span.textContent = char;
        span.style.setProperty("--d", `${delay}ms`);
        delay += step;
        return span;
      });
      child.replaceWith(...chars);
    }
    return delay;
  };
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const lines = [...document.querySelectorAll("#title .line")];
    let delay = 0;
    lines.filter((line) => !line.classList.contains("by")).forEach((line) => { delay = splitChars(line, delay, 35); });
    const by = document.querySelector("#title .by");
    const end = splitChars(by, 1000, 55);
    by.style.setProperty("--caret", `${end}ms`);
    // Буквы — только для глаз, экранный диктор читает aria-label заголовка
    lines.forEach((line) => line.setAttribute("aria-hidden", "true"));
  }

  // Карусель: слайды — из карточек страницы Apps, новое приложение попадает в неё само
  const track = $("track");
  const loadCards = async () => {
    const response = await fetch("apps.html");
    if (!response.ok) throw new Error(`apps.html: ${response.status}`);
    const page = new DOMParser().parseFromString(await response.text(), "text/html");
    return [...page.querySelectorAll(".app")];
  };
  const startCarousel = (cards) => {
    // Без скриншота приложение в карусель не попадает; без ссылки App Market слайд ведёт на страницу Apps
    cards.filter((card) => card.querySelector(".shot img")).forEach((card) => {
      const slide = document.createElement("a");
      slide.className = "slide";
      slide.href = card.querySelector(".actions a.cta")?.getAttribute("href") ?? "apps";
      const image = document.createElement("img");
      image.src = card.querySelector(".shot img").getAttribute("src");
      image.alt = "";
      image.width = 1200;
      image.height = 900;
      const name = document.createElement("span");
      name.textContent = card.querySelector("h2").textContent;
      slide.append(image, name);
      track.append(slide);
    });
    $("carousel").hidden = false;

    const currentSlide = () => Math.round(track.scrollLeft / track.clientWidth);
    const showSlide = (index) => {
      const count = track.children.length;
      track.scrollTo({ left: ((index + count) % count) * track.clientWidth });
    };
    const updateCount = () => {
      $("carousel-count").textContent = `${currentSlide() + 1} / ${track.children.length}`;
    };
    track.addEventListener("scroll", updateCount, { passive: true });
    updateCount();
    $("carousel-prev").addEventListener("click", () => showSlide(currentSlide() - 1));
    $("carousel-next").addEventListener("click", () => showSlide(currentSlide() + 1));

    // Автопрокрутка: стоит под курсором и фокусом, кнопка выключает её совсем
    let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    let held = false;
    const updateToggle = () => {
      $("carousel-toggle").textContent = playing ? "❚❚" : "▶";
      $("carousel-toggle").setAttribute("aria-label", playing ? "Pause carousel" : "Play carousel");
    };
    updateToggle();
    $("carousel-toggle").addEventListener("click", () => {
      playing = !playing;
      updateToggle();
    });
    const hold = (value) => () => { held = value; };
    $("carousel").addEventListener("pointerenter", hold(true));
    $("carousel").addEventListener("pointerleave", hold(false));
    $("carousel").addEventListener("focusin", hold(true));
    $("carousel").addEventListener("focusout", hold(false));
    setInterval(() => {
      if (playing && !held && !document.hidden) showSlide(currentSlide() + 1);
    }, 5000);
  };
  // Без карусели остаётся заголовок; ошибка — в консоли
  loadCards().then(startCarousel).catch((error) => console.error(error));
</script>

</body>
</html>
