  .contacts li:nth-child(2) .contact { animation-delay:.28s; }
  .contacts li:nth-child(3) .contact { animation-delay:.36s; }
  .contacts li:nth-child(4) .contact { animation-delay:.44s; }
  .contact:hover { transform:translateX(6px); border-color:var(--brand); background:#181e1b; }
  .gmail { --brand:#ea4335; }
  .telegram { --brand:#26a5e4; }
  .icon { flex:none; display:grid; place-items:center; width:48px; height:48px; border-radius:12px; background:#0a0d0c; transition:transform .25s cubic-bezier(.2,.8,.2,1); }
  .icon svg { width:26px; height:26px; fill:var(--brand); }
  .contact:hover .icon { transform:scale(1.1) rotate(-6deg); }
  .text { min-width:0; }
  .kind { display:block; color:#9daaa4; font:500 12px "Geist Mono", ui-monospace, Menlo, Consolas, monospace; }
  .value { display:block; font-size:18px; line-height:1.35; overflow-wrap:anywhere; }

  @media (prefers-reduced-motion:reduce) {
    h1, .lead, .line, .contact, .icon { animation:none; transition:none; }
    .contact:hover { transform:none; }
    .contact:hover .icon { transform:none; }
  }
